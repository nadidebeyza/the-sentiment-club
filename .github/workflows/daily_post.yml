name: Daily Instagram Automation (Post & Story)

on:
  schedule:
    # 1. Her gün UTC 11:00 (Türkiye saati 14:00) -> Story
    - cron: '0 11 * * *'
    # 2. Her gün UTC 17:00 (Türkiye saati 20:00) -> Feed Post
    - cron: '0 17 * * *'

  workflow_dispatch:
    inputs:
      run_type:
        description: 'What to run'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - post_only
          - story_only

concurrency:
  group: sentiment-club-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  run-post:
    if: >
      github.event.schedule == '0 17 * * *' || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_type != 'story_only')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install google-genai pillow requests python-dotenv

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Main Post Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          BRAND_NAME: ${{ secrets.BRAND_NAME }}
          WATERMARK_TEXT: ${{ secrets.WATERMARK_TEXT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python main.py

      - name: Commit word history
        run: |
          git add word_history.json || true
          git commit -m "Update word history [post]" || true
          git push || true

  run-story:
    needs: [run-post]
    if: >
      always() && (
        github.event.schedule == '0 11 * * *' || 
        (github.event_name == 'workflow_dispatch' && github.event.inputs.run_type != 'post_only')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }} || true

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install google-genai pillow requests python-dotenv

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Story Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          BRAND_NAME: ${{ secrets.BRAND_NAME }}
          WATERMARK_TEXT: ${{ secrets.WATERMARK_TEXT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python story.py

      - name: Commit word history
        run: |
          git add word_history.json || true
          git commit -m "Update word history [story]" || true
          git push || true
