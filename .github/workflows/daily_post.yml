name: Daily Instagram Automation

on:
  schedule:
    # Cron Zamanlaması: Her gün UTC ile 17:00 (Türkiye Saati ile 20:00)
    - cron: '0 17 * * *'

  # İstediğiniz zaman GitHub panelinden manuel çalıştırmak için buton ekler
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      # 1. Proje dosyalarını bulut sunucuya çek
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Son 30 kelime geçmişini önceki çalışmalardan geri yükle
      - name: Restore word history cache
        uses: actions/cache@v4
        with:
          path: word_history.json
          key: word-history-${{ github.ref_name }}
          save-always: true

      # 3. Python ortamını kur
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Gerekli kütüphaneleri ve Türkçe/Asya font desteklerini yükle
      - name: Install dependencies & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install google-genai pillow requests python-dotenv

      # 5. Kodunuzu çalıştır ve Instagram'a gönder
      #    (başarılı yayın sonrası word_history.json güncellenir; cache job sonunda saklanır)
      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python main.py
